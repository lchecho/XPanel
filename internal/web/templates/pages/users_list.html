{{define "users_list.html"}}{{template "head" .}}
<body>{{template "nav" .}}<main><h1>用户</h1>{{template "messages" .}}
<form method="get" action="/users" class="filters" aria-label="搜索与筛选">
  <label for="q">按名称搜索</label>
  <input id="q" name="q" value="{{.Data.Query}}">
  <label for="status">状态</label>
  <select id="status" name="status">{{$current := .Data.Status}}{{range .Data.Statuses}}<option value="{{.Value}}"{{if eq .Value $current}} selected{{end}}>{{.Label}}</option>{{end}}</select>
  <label><input type="checkbox" name="deleted" value="1"{{if .Data.IncludeDeleted}} checked{{end}}> 包含已删除</label>
  <button type="submit">筛选</button>
</form>
<p><a href="/users/new" class="button">创建用户</a></p>
<p id="refresh-status" class="hint" aria-live="polite">表格每 5 秒自动刷新；脚本未加载时请手动刷新页面。</p>
<div id="users-table" hx-get="{{.Data.FragmentQuery}}" hx-trigger="every 5s" hx-swap="innerHTML">{{template "users_table.html" .}}</div>
{{template "footer" .}}</main>{{template "scripts" .}}</body></html>{{end}}
